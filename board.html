<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardboard History | Japanese Learning</title>
<script>try{if(localStorage.getItem('jl_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---- cardboard board: cream panel, dark outlines, hard offset shadows ---- */
  .board {
    background-color:#f7f2e7;
    background-image:radial-gradient(rgba(42,38,32,.07) 1.4px, transparent 1.5px);
    background-size:22px 22px;
    border:3px solid #2a2620;
    border-radius:18px;
    padding:24px;
    box-shadow:10px 12px 0 rgba(42,38,32,.14);
  }
  .board h3 {
    display:inline-flex; align-items:center; gap:8px;
    background:#fffdf5; color:#2f2a22;
    border:2px solid #2a2620; border-radius:999px;
    padding:6px 16px; margin:2px 4px 20px;
    font-size:1rem; letter-spacing:.3px;
    box-shadow:4px 4px 0 rgba(42,38,32,.85);
    transform:rotate(-1deg);
  }
  .cols section:nth-child(2) h3 { transform:rotate(1.2deg); }
  .board h3 .cnt { opacity:.55; font-weight:400; font-size:.8rem; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  @media (max-width:820px){ .cols { grid-template-columns:1fr; } }

  /* ---- pinned paper notes: pin pierced through the paper ---- */
  .notes { display:grid; grid-template-columns:repeat(auto-fill, minmax(172px, 1fr)); gap:24px 16px; padding-top:12px; }
  .note {
    position:relative; background:#fffdf5; color:#2f2a22;
    border:2px solid #2a2620; border-radius:10px;
    padding:28px 12px 12px; min-height:96px;
    font-size:.95rem; line-height:1.45; word-break:break-word;
    box-shadow:5px 6px 0 rgba(42,38,32,.85);
    transform:rotate(-1.2deg);
  }
  .note:nth-child(2n){ transform:rotate(1.1deg); }
  .note:nth-child(3n){ transform:rotate(-.4deg); }
  /* pin head, sitting on top of the paper edge */
  .note::before {
    content:''; position:absolute; top:-11px; left:50%; margin-left:-9px;
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #ffb0b0, var(--accent) 58%, #7d2325);
    border:2px solid #2a2620;
    box-shadow:2px 3px 0 rgba(42,38,32,.3);
    z-index:3;
  }
  /* needle, running down through the paper */
  .note::after {
    content:''; position:absolute; top:-2px; left:50%; margin-left:-1.5px;
    width:3px; height:30px; border-radius:2px;
    background:linear-gradient(180deg, #f2f2f2, #9a9a9a 65%, #606060);
    box-shadow:1px 0 0 rgba(42,38,32,.25);
    z-index:2;
  }
  /* dent where the needle enters the paper */
  .pin-hole {
    position:absolute; top:6px; left:50%; margin-left:-5px;
    width:10px; height:4px; border-radius:50%;
    background:rgba(42,38,32,.3);
    box-shadow:0 1px 0 rgba(42,38,32,.18);
  }
  .note .task-text { margin-top:8px; }
  .note .meta { font-size:.72rem; opacity:.75; margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badge { background:#f1ede2; border:1.5px solid #2a2620; padding:1px 8px; border-radius:999px; white-space:nowrap; font-size:.72rem; }
  .badge.ov { background:var(--tint-err); color:var(--err); font-weight:700; }
  .note.overdue { background:#ffecec; }
  .note.done { background:#f1efe6; opacity:.95; }
  .note.done .task-text { text-decoration:line-through; opacity:.6; }
  .note.pin-green::before, .note.done::before {
    background:radial-gradient(circle at 32% 28%, #b8ecc6, var(--ok) 58%, #1c6b3d);
  }
  .note-actions { position:absolute; top:12px; right:7px; display:flex; gap:3px; opacity:.85; z-index:1; }
  .note-actions button {
    border:1.5px solid #2a2620; background:#fffdf5; cursor:pointer; font-size:.88rem;
    padding:2px 5px; border-radius:7px; line-height:1;
    box-shadow:2px 2px 0 rgba(42,38,32,.7);
  }
  .note-actions button:hover { background:#f1ede2; }
  .note-actions button:active { transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(42,38,32,.7); }
  .empty-note { color:#6b6153; font-size:.92rem; margin:8px 4px; }

  /* ---- add-task strip: paper scrap with a blue pin ---- */
  .add-strip {
    position:relative; background:#fffdf5; color:#2f2a22;
    border:2px solid #2a2620; border-radius:12px;
    transform:rotate(-.6deg);
    box-shadow:6px 7px 0 rgba(42,38,32,.85);
    padding:20px 14px 14px; display:flex; gap:8px; flex-wrap:wrap;
    max-width:680px; margin:0 auto 30px;
  }
  .add-strip::before {
    content:''; position:absolute; top:-10px; left:24px; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #bcd9ff, var(--blue) 58%, #12263f);
    border:2px solid #2a2620;
    box-shadow:2px 3px 0 rgba(42,38,32,.3);
  }
  .add-strip::after {
    content:''; position:absolute; top:-2px; left:31px; margin-left:-1.5px;
    width:3px; height:26px; border-radius:2px;
    background:linear-gradient(180deg, #f2f2f2, #9a9a9a 65%, #606060);
  }
  .add-strip input {
    border:2px solid #2a2620; border-radius:8px; background:#fff;
    padding:9px 11px; font-family:inherit; font-size:.95rem; color:inherit;
  }
  .add-strip input:focus { outline:2px solid var(--blue); outline-offset:2px; }
  #b-text { flex:1; min-width:190px; }
  #b-date { min-width:140px; }
  #b-add {
    background:var(--blue); color:#fff;
    border:2px solid #2a2620; border-radius:10px;
    padding:10px 18px; font-weight:700; font-family:inherit; cursor:pointer;
    box-shadow:4px 4px 0 #2a2620;
  }
  #b-add:hover { filter:brightness(1.1); }
  #b-add:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #2a2620; }
</style>
</head>
<body>
<header class="topbar"><span class="brand-badge jp">日本語</span><span class="brand-title">Cardboard History</span></header>
<nav id="nav"></nav>
<main>
  <div class="page-head">
    <h2>📌 Cardboard History</h2>
    <p class="muted">Pin tasks to plan, finish them, and look back on what you did.</p>
  </div>

  <div class="add-strip">
    <input type="text" id="b-text" placeholder="What needs doing?" maxlength="200">
    <input type="date" id="b-date">
    <button class="btn primary" id="b-add">📌 Add</button>
  </div>

  <div class="board">
    <div class="cols">
      <section>
        <h3>🕗 <span>Upcoming</span> <span class="cnt">(<span id="up-count">0</span>)</span></h3>
        <div class="notes" id="up-notes"></div>
      </section>
      <section>
        <h3>✅ <span>Finished</span> <span class="cnt">(<span id="fin-count">0</span>)</span></h3>
        <div class="notes" id="fin-notes"></div>
      </section>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var KEY = 'board_tasks';
  var TASKS = JL.pref(KEY) || [];
  if (JL.pref(KEY) === null) JL.pref(KEY, []);

  function save() { JL.pref(KEY, TASKS); }

  function fmtD(v) {
    try { return new Date(v + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
    catch (e) { return v; }
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function render() {
    var td = todayStr();
    var pend = TASKS.filter(function (t) { return !t.done; })
      .sort(function (a, b) { return (a.due || '9999-99-99') < (b.due || '9999-99-99') ? -1 : 1; });
    var fin = TASKS.filter(function (t) { return t.done; })
      .sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });
    document.getElementById('up-count').textContent = pend.length;
    document.getElementById('fin-count').textContent = fin.length;

    document.getElementById('up-notes').innerHTML = pend.map(function (t) {
      var cls = 'note' + (t.due && t.due < td ? ' overdue' : '');
      var badge = !t.due ? '<span class="badge">Someday</span>'
        : (t.due === td ? '<span class="badge">Today</span>'
        : (t.due < td ? '<span class="badge ov">Overdue</span>' : ''));
      return '<div class="' + cls + '" data-id="' + t.id + '"><span class="pin-hole"></span><div class="task-text">' + JL.esc(t.text) + '</div>' +
        '<div class="meta">' + (t.due ? '<span>📅 ' + JL.esc(fmtD(t.due)) + '</span>' : '') + badge + '</div>' +
        '<div class="note-actions"><button class="act-done" title="Mark done">✓</button><button class="act-del" title="Delete">🗑️</button></div></div>';
    }).join('') || '<p class="empty-note">No tasks yet — pin your first one!</p>';

    document.getElementById('fin-notes').innerHTML = fin.map(function (t) {
      return '<div class="note done pin-green" data-id="' + t.id + '"><span class="pin-hole"></span><div class="task-text">' + JL.esc(t.text) + '</div>' +
        '<div class="meta"><span>✅ ' + (t.doneAt ? JL.esc(fmtD(new Date(t.doneAt).toISOString().slice(0, 10))) : '') + '</span></div>' +
        '<div class="note-actions"><button class="act-undo" title="Move back to upcoming">↩</button><button class="act-del" title="Delete">🗑️</button></div></div>';
    }).join('') || '<p class="empty-note">Nothing finished yet.</p>';

    wire(document.getElementById('up-notes'));
    wire(document.getElementById('fin-notes'));
  }

  function wire(box) {
    Array.prototype.forEach.call(box.querySelectorAll('.note'), function (n) {
      var id = n.dataset.id, b;
      if ((b = n.querySelector('.act-done'))) b.onclick = function () {
        TASKS.forEach(function (t) { if (String(t.id) === id) { t.done = true; t.doneAt = Date.now(); } });
        save(); render(); JL.toast('Moved to Finished ✅', 'ok');
      };
      if ((b = n.querySelector('.act-undo'))) b.onclick = function () {
        TASKS.forEach(function (t) { if (String(t.id) === id) { t.done = false; t.doneAt = null; } });
        save(); render();
      };
      if ((b = n.querySelector('.act-del'))) b.onclick = function () {
        TASKS = TASKS.filter(function (t) { return String(t.id) !== id; });
        save(); render(); JL.toast('Task deleted.', 'warn');
      };
    });
  }

  document.getElementById('b-add').onclick = function () {
    var inp = document.getElementById('b-text'), dt = document.getElementById('b-date');
    var text = inp.value.trim();
    if (!text) { JL.toast('Type a task first.', 'err'); return; }
    TASKS.push({
      id: String(Date.now()) + String(Math.floor(Math.random() * 900) + 100),
      text: text, due: dt.value || '', done: false, doneAt: null
    });
    inp.value = ''; dt.value = '';
    save(); render();
    JL.toast('Pinned to the board ✅', 'ok');
  };

  render();
})();
</script>
</body>
</html>
